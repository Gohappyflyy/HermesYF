name: HermesYF regression
on:
  push:
    paths: ['yf_tools/**', 'yf_tests/**', 'skills/security/hermesyf-authorized-assessment/**', '.github/workflows/hermesyf.yml']
  pull_request:
    paths: ['yf_tools/**', 'yf_tests/**', 'skills/security/hermesyf-authorized-assessment/**', '.github/workflows/hermesyf.yml']
permissions:
  contents: read
jobs:
  standard-library-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s yf_tests -v
